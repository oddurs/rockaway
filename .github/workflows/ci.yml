name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The site builds from the packages' dist, as a consumer's app would, so
      # it builds here, after them, and is typechecked against their
      # published declarations as part of its own build.
      - name: Build packages and the site
        run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # The built site, for a reviewer to open. Deploying it is a separate
      # workflow (cairn 0146).
      - name: Upload the built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist
          retention-days: 14

      # The workspace resolves to source, so this is the only step that sees
      # what a consumer installs: each tarball's contents, publint, Are the
      # Types Wrong, and a server component that renders Frame from dist.
      - name: Packed packages (contents, publint, attw, server components)
        run: pnpm packages:check

      - name: Install Chromium
        run: pnpm --filter workbench exec playwright install --with-deps chromium

      # EXPERIMENT (cairn 0164), removed before merge: the pointer stories alone,
      # each run a fresh browser with a cold font cache, twenty times over.
      - name: EXPERIMENT pointer stories from a cold cache
        run: |
          failed=0
          for i in $(seq 1 20); do
            if pnpm --filter workbench exec vitest run --project storybook src/components/Link.stories.tsx src/components/Button.stories.tsx > run.log 2>&1; then
              echo "run $i: pass"
            else
              failed=$((failed + 1))
              echo "run $i: FAIL"
              grep -E "×|expected" run.log | head -8
            fi
          done
          echo "$failed of 20 failed"

      - name: Tests (tokens, stories in Vitest browser mode with axe, the built site)
        run: pnpm test
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Contrast report (every declared pair, both modes)
        run: pnpm --filter @rockaway/tokens contrast

      - name: Production build of the workbench (a minifier sees the CSS)
        run: pnpm --filter workbench build

  changeset:
    name: Changeset for every package change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the branch can be compared with where it left main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Every package that ships a change is named by a changeset
        run: node scripts/check-changeset.ts "origin/$GITHUB_BASE_REF"

  roadmap:
    name: Roadmap is valid and rendered
    runs-on: ubuntu-latest
    env:
      CAIRN_REV: e82f996a8a06e07d58f5c37c46cf17b12a06367a
    steps:
      - uses: actions/checkout@v7

      # The roadmap is at cairn format 5, which no release reads yet, so cairn is
      # built from a pinned commit of main. The binary is cached by that commit:
      # the first run compiles, every later one restores it in a second. Move the
      # pin and the cache key together, or back to a release tag once one ships.
      - name: Cache cairn
        id: cairn-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cairn
          key: cairn-${{ runner.os }}-${{ env.CAIRN_REV }}

      - name: Install cairn
        if: steps.cairn-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/oddurs/cairn --rev "$CAIRN_REV" cairn-md

      - name: Items match the schema
        run: cairn check

      - name: ROADMAP.md is up to date
        run: cairn render --check
