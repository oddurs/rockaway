name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change reaches past the roadmap. A pull request that only files
  # or edits cairn items, and the roadmap rendered from them, cannot change what
  # the code jobs check, so they are skipped, and the required check counts a
  # skip as a pass. The roadmap job still runs. A push to main runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(cairn/|ROADMAP\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # The checks that need no browser. Lint, types, the packages and the site
  # built as a consumer would build them, the packed packages, the packages'
  # Node tests and the contrast report. The site's tests and the stories run
  # beside it.
  static:
    name: Lint, typecheck, build, package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The site (apps/web, Next.js) builds from the packages' dist, as a
      # consumer's app would, so it builds here, after them, and is
      # typechecked against their published declarations as part of its own
      # build. Its static export is out/.
      - name: Build packages and the site
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # The built site, for a reviewer to open. Deploying it is a separate
      # workflow (cairn 0146).
      - name: Upload the built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/out
          retention-days: 14

      # The workspace resolves to source, so this is the only step that sees
      # what a consumer installs: each tarball's contents, publint, Are the
      # Types Wrong, and a server component that renders Frame from dist.
      - name: Packed packages (contents, publint, attw, server components)
        run: pnpm packages:check

      - name: Tests (tokens, grid, css, react, mcp)
        run: pnpm -r --filter './packages/*' test

      - name: Contrast report (every declared pair, both modes)
        run: pnpm --filter @rockaway/tokens contrast

  # The site's own tests load its export in a browser: every page from the
  # site itself, axe, conformance and continuity, no layout shift at four
  # widths on a fast connection and Slow 4G, no reload in ten routes, and
  # navigation's interaction to next paint. They take longer than the rest of
  # `static` together, so they have a job of their own, which builds the site
  # again rather than wait for one.
  site-tests:
    name: Site tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build packages and the site
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - uses: ./.github/actions/playwright
        with:
          filter: web

      - name: Tests (the built site)
        run: pnpm --filter web test

  # A minifier sees the CSS here. Storybook's build needs nothing from the
  # other jobs, so it runs beside them.
  workbench-build:
    name: Production build of the workbench
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build the packages the workbench imports
        run: pnpm -r --filter './packages/*' build

      - name: Production build of the workbench
        run: pnpm --filter workbench build

  # The stories, one Vitest project per job, and the busiest projects cut again
  # with --shard (apps/workbench/vitest.config.ts). The packages are built
  # first because the config imports @rockaway/tokens. Every shard is a
  # separate runner, so CI wall clock is the slowest shard, not the sum.
  stories:
    name: Stories, ${{ matrix.project }} ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: storybook, shard: 1/4 }
          - { project: storybook, shard: 2/4 }
          - { project: storybook, shard: 3/4 }
          - { project: storybook, shard: 4/4 }
          - { project: p3, shard: 1/2 }
          - { project: p3, shard: 2/2 }
          - { project: forced-colors, shard: 1/1 }
          - { project: zoom, shard: 1/1 }
          - { project: classic-scrollbars, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build the packages the workbench imports
        run: pnpm -r --filter './packages/*' build

      - uses: ./.github/actions/playwright

      - name: Stories in Vitest browser mode with axe
        run: >-
          pnpm --filter workbench exec vitest run
          --project ${{ matrix.project }} --shard ${{ matrix.shard }}

  # The required check. Its name is what branch protection asks for, so it stays
  # when the work behind it is split up; it passes when every job it stands for
  # has, and `always()` makes it fail, rather than skip, when one does not.
  check:
    name: Lint, typecheck, build, test
    if: always()
    needs: [changes, static, site-tests, workbench-build, stories]
    runs-on: ubuntu-latest
    steps:
      - name: Every job it stands for passed, or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done

  # The site's budget (cairn 0109): every page's first load at most 150 kB
  # gzipped shared, and at most 30 kB more on any page, printed on every run.
  # A job of its own, beside the others, so a regression is named in the
  # checks' list rather than found in a log.
  site-budget:
    name: Site budget
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The site is built from the packages' dist, as a consumer's app would be.
      - name: Build packages and the site
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Hold the built site to its budget
        run: pnpm --filter web budget

  changeset:
    name: Changeset for every package change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the branch can be compared with where it left main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Every package that ships a change is named by a changeset
        run: node scripts/check-changeset.ts "origin/$GITHUB_BASE_REF"

  roadmap:
    name: Roadmap is valid and rendered
    runs-on: ubuntu-latest
    env:
      CAIRN_REV: e82f996a8a06e07d58f5c37c46cf17b12a06367a
    steps:
      - uses: actions/checkout@v7

      # The roadmap is at cairn format 5, which no release reads yet, so cairn is
      # built from a pinned commit of main. The binary is cached by that commit:
      # the first run compiles, every later one restores it in a second. Move the
      # pin and the cache key together, or back to a release tag once one ships.
      - name: Cache cairn
        id: cairn-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cairn
          key: cairn-${{ runner.os }}-${{ env.CAIRN_REV }}

      - name: Install cairn
        if: steps.cairn-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/oddurs/cairn --rev "$CAIRN_REV" cairn-md

      - name: Items match the schema
        run: cairn check

      - name: ROADMAP.md is up to date
        run: cairn render --check
