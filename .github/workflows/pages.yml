name: Pages

# The site, deployed from main (cairn 0146). Its own workflow, so a change to
# CI never touches the deploy and the other way round.
#
# Build, check, then deploy: a build or a link check that fails stops the run
# before anything is uploaded, the run goes red on the commit, and the last
# good deploy stays up, because Pages only replaces it with a new artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never one cancelled half way: a newer push waits
# for the one in flight, then goes out.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # Where 0145 put the site: a project site at oddurs.github.io/rockaway/.
  # A custom domain later changes these two lines and nothing else.
  SITE_URL: https://oddurs.github.io
  SITE_BASE: /rockaway/

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The packages, then the site from their dist, as in CI.
      - name: Build
        run: pnpm build

      - name: Every internal link and asset resolves under the base
        run: pnpm --filter site check:links

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
