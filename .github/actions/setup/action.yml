name: Set up the workspace
description: pnpm, Node from .nvmrc, the pnpm store from cache, and a frozen install.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    # setup-node caches the pnpm store, keyed by the lockfile.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
