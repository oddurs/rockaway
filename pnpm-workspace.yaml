packages:
  - packages/*
  - apps/*

# Exact versions, so a lockfile diff is always a deliberate change.
savePrefix: ''

# Install scripts are blocked by default; allow only what is known to need one.
allowBuilds:
  esbuild: true

# The server-component fixture in @rockaway/react uses only this package's Node
# loader and Flight server, never its webpack plugin, so webpack (and the
# fifty-odd packages behind it) need not be installed for it.
packageExtensions:
  react-server-dom-webpack:
    peerDependenciesMeta:
      webpack:
        optional: true


  # `astro check` supports TypeScript 5 and 6, and the repository is on 7 (cairn
  # 0170). The language server it is built on gets a TypeScript 6 of its own,
  # under another name so no `tsc` from it lands on anyone's path, and the
  # site's `check:astro` script hands it that one. Drop this when the .astro
  # check runs on 7 (Astro points at @astrojs/ts-content-mapper, for 7.1).
  '@astrojs/language-server':
    dependencies:
      typescript-6: npm:typescript@6.0.3
